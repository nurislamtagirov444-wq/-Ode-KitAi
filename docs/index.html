<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ode KitAi</title><style>body{margin:0;background:#070a12;color:#eef4ff;font:15px system-ui}main{max-width:980px;margin:auto;padding:10px}.p{background:#0d1422;border:1px solid #26334a;border-radius:16px;padding:12px;margin:10px 0}h1,h2{margin:.2em 0}.grid{display:grid;grid-template-columns:1fr 330px;gap:10px}textarea,input,select,button{width:100%;box-sizing:border-box;border-radius:12px;border:1px solid #2b3b55;background:#07111f;color:#eef4ff;padding:10px;margin:5px 0}button{background:#00e0a4;color:#04110d;font-weight:800}.b{background:#17233a;color:#eef4ff}.msg{white-space:pre-wrap;background:#111d2f;border-left:3px solid #00e0a4;border-radius:12px;padding:10px;margin:8px 0}.u{border-left-color:#8ab4ff}.small{color:#94a3b8;font-size:13px}.row{display:grid;grid-template-columns:1fr 1fr;gap:6px}@media(max-width:800px){.grid,.row{grid-template-columns:1fr}}</style><main><h1>Ode KitAi Android</h1><div class="p small">ПК не нужен. Модель не скачивается. Дата берётся из телефона. Моды = текст/ссылки/README/файлы, которые добавляются в контекст.</div><div class="grid"><section class="p"><h2>Чат</h2><div id="log"></div><textarea id="q" rows="4" placeholder="Запрос"></textarea><button id="send">Отправить</button><button class="b" id="clear">Очистить</button></section><aside class="p"><h2>Настройки</h2><button id="login">Войти Puter</button><button class="b" id="check">Проверить вход</button><div id="auth" class="small">Вход не проверен</div><label>Модель<input id="model" value="anthropic/claude-sonnet-4-5"></label><div class="row"><label>Температура<input id="temp" type="number" min="0" max="2" step="0.05" value="0.2"></label><label>Max tokens<input id="max" type="number" value="4096"></label></div><div class="row"><label>Глубокие проходы<select id="passes"><option>1</option><option selected>2</option><option>3</option></select></label><label>Reasoning<select id="effort"><option>low</option><option>medium</option><option selected>high</option><option>xhigh</option></select></label></div><label>Промпт<textarea id="sys" rows="9"></textarea></label></aside></div><section class="p"><h2>Моды</h2><input id="url" placeholder="GitHub repo / файл / страница"><button id="load">Загрузить ссылку как мод</button><textarea id="modtxt" rows="5" placeholder="Или вставь текстовый мод"></textarea><button class="b" id="addtxt">Добавить текстовый мод</button><input id="files" type="file" multiple><button class="b" id="addfiles">Добавить файлы</button><div id="mods" class="small"></div></section><section class="p"><h2>Поиск</h2><input id="s" placeholder="Запрос поиска"><select id="stype"><option value="auto">Auto</option><option value="jina">Jina</option><option value="github">GitHub</option><option value="wiki">Wikipedia</option><option value="hn">Hacker News</option><option value="so">Stack Overflow</option><option value="npm">NPM</option></select><button id="search">Искать</button><div id="res"></div></section></main><script src="https://js.puter.com/v2/"></script><script>const $=id=>document.getElementById(id),S='ode-mini-v1',M='ode-mini-mods';$('sys').value=localStorage[S]||`KZ_Lemon4ik Absolute. Facts over agreement. Never validate false claims. Be direct, concise, structured. No pleasantries, no emojis, no invented facts. If data is insufficient, state it. For code: design, risks, exact steps, verification. Do not reveal hidden chain-of-thought; show only concise public reasoning.`;let mods=JSON.parse(localStorage[M]||'[]');function save(){localStorage[S]=$('sys').value;localStorage[M]=JSON.stringify(mods)}function msg(r,t){let d=document.createElement('div');d.className='msg '+(r==='USER'?'u':'');d.textContent=r+'\n'+t;$('log').appendChild(d);scrollTo(0,document.body.scrollHeight)}function date(){let n=new Date;return n.toLocaleString('ru-RU',{weekday:'long',year:'numeric',month:'long',day:'numeric',hour:'2-digit',minute:'2-digit',second:'2-digit',timeZoneName:'short'})+'\nISO: '+n.toISOString()}function isDate(x){x=x.toLowerCase();return x.length<100&&/(сегодня|сейчас|текущ|какой|какая).*(дата|число|год|время)|what.*(date|time|year)/.test(x)}function modsText(){return mods.map((m,i)=>`MOD ${i+1}: ${m.t}\n${m.u}\n${m.c.slice(0,12000)}`).join('\n---\n')}function renderMods(){ $('mods').textContent=mods.length?mods.map((m,i)=>`${i+1}. ${m.t} (${m.c.length} симв.)`).join('\n'):'Модов нет'}renderMods();async function auth(){try{let ok=await puter.auth.isSignedIn();$('auth').textContent=ok?'Вошёл':'Не вошёл';return ok}catch(e){$('auth').textContent='Ошибка входа: '+e.message;return false}}$('login').onclick=async()=>{try{await puter.auth.signIn({attempt_temp_user_creation:true});await auth()}catch(e){$('auth').textContent=e.message}};$('check').onclick=auth;$('clear').onclick=()=>{$('log').innerHTML=''};function options(){return{model:$('model').value,temperature:+$('temp').value,max_tokens:+$('max').value,reasoning_effort:$('effort').value,reasoning:{effort:$('effort').value},verbosity:'high',text:{verbosity:'high'}}}async function call(messages){if(!await auth())await puter.auth.signIn({attempt_temp_user_creation:true});let r=await puter.ai.chat(messages,options());return typeof r==='string'?r:r?.message?.content||r?.text||r?.content||JSON.stringify(r)}function system(extra=''){return $('sys').value+'\nCurrent date/time from phone:\n'+date()+'\nActive mods and search context:\n'+modsText()+'\n'+extra}async function answer(q){msg('USER',q);if(isDate(q)){msg('ASSISTANT',date());return}let searchCtx='';if(/найди|поиск|интернет|свеж|актуаль|github|ошибка|код|api|202[4-9]/i.test(q))searchCtx=await doSearch(q,true).catch(e=>'SEARCH ERROR: '+e.message);let base=[{role:'system',content:system(searchCtx)},{role:'user',content:q}],p=+$('passes').value;if(p<2){msg('ASSISTANT',await call(base));return}let a=await call([{role:'system',content:system(searchCtx)+'\nInternal pass: make concise plan, risks, checks. Do not answer user.'},{role:'user',content:q}]);let c='';if(p>2)c=await call([{role:'system',content:system(searchCtx)+'\nInternal critic: find mistakes in plan. Do not answer user.'},{role:'user',content:'Plan:\n'+a}]);msg('ASSISTANT',await call([{role:'system',content:system(searchCtx)+'\nUse this internal plan, do not repeat it verbatim:\n'+a+'\nCritique:\n'+c},{role:'user',content:q}]))}$('send').onclick=()=>{let q=$('q').value.trim();if(q){$('q').value='';answer(q).catch(e=>msg('ASSISTANT','Ошибка: '+e.message))}};async function txt(u){let r=await fetch(u);if(!r.ok)throw Error('HTTP '+r.status);return await r.text()}async function js(u){let r=await fetch(u,{headers:{Accept:'application/json'}});if(!r.ok)throw Error('HTTP '+r.status);return await r.json()}function gh(u){try{u=new URL(u);if(!/github.com$/.test(u.hostname))return null;let p=u.pathname.split('/').filter(Boolean);if(p.length<2)return null;return{owner:p[0],repo:p[1],file:p[2]==='blob'?p.slice(4).join('/'):''}}catch{return null}}async function loadUrl(u){let g=gh(u);if(g&&!g.file){let info=await js(`https://api.github.com/repos/${g.owner}/${g.repo}`),read=await js(`https://api.github.com/repos/${g.owner}/${g.repo}/readme`);let c=atob(read.content.replace(/\n/g,''));mods.unshift({t:info.full_name,u:info.html_url,c:`${info.description||''}\n${decodeURIComponent(escape(c))}`});save();renderMods();return}if(g&&g.file){u=`https://raw.githubusercontent.com/${g.owner}/${g.repo}/main/${g.file}`}let c=await txt('https://r.jina.ai/http://r.jina.ai/http://'+u).catch(()=>txt(u));mods.unshift({t:u,u,c});save();renderMods()}$('load').onclick=()=>loadUrl($('url').value.trim()).catch(e=>alert(e.message));$('addtxt').onclick=()=>{let c=$('modtxt').value.trim();if(c){mods.unshift({t:'manual',u:'manual',c});$('modtxt').value='';save();renderMods()}};$('addfiles').onclick=async()=>{for(let f of $('files').files){let c=await f.text();mods.unshift({t:f.name,u:'local file',c})}save();renderMods()};async function search(q,type){let out=[];if(type==='auto'||type==='github'){let d=await js(`https://api.github.com/search/repositories?q=${encodeURIComponent(q)}&sort=stars&order=desc&per_page=5`).catch(()=>({items:[]}));out.push(...(d.items||[]).map(x=>({t:x.full_name,u:x.html_url,d:x.description||''})))}if(type==='auto'||type==='wiki'){let d=await js(`https://ru.wikipedia.org/w/api.php?action=opensearch&search=${encodeURIComponent(q)}&limit=5&format=json&origin=*`).catch(()=>[0,[],[],[]]);out.push(...(d[1]||[]).map((t,i)=>({t,u:d[3][i],d:d[2][i]})))}if(type==='auto'||type==='hn'){let d=await js(`https://hn.algolia.com/api/v1/search?query=${encodeURIComponent(q)}&hitsPerPage=5`).catch(()=>({hits:[]}));out.push(...(d.hits||[]).map(x=>({t:x.title||x.story_title,u:x.url||`https://news.ycombinator.com/item?id=${x.objectID}`,d:'HN'})))}if(type==='auto'||type==='so'){let d=await js(`https://api.stackexchange.com/2.3/search/advanced?order=desc&sort=relevance&q=${encodeURIComponent(q)}&site=stackoverflow&pagesize=5`).catch(()=>({items:[]}));out.push(...(d.items||[]).map(x=>({t:x.title,u:x.link,d:'score '+x.score})))}if(type==='auto'||type==='npm'){let d=await js(`https://registry.npmjs.org/-/v1/search?text=${encodeURIComponent(q)}&size=5`).catch(()=>({objects:[]}));out.push(...(d.objects||[]).map(x=>({t:x.package.name,u:x.package.links.npm,d:x.package.description||''})))}if(type==='jina'||type==='auto'){let c=await txt(`https://s.jina.ai/${encodeURIComponent(q)}`).catch(()=>'');if(c)out.unshift({t:'Jina search',u:'https://s.jina.ai',d:c.slice(0,1000),c})}return out}async function doSearch(q,ctx=false){let r=await search(q,$('stype').value);if(ctx)return r.map((x,i)=>`RESULT ${i+1}\n${x.t}\n${x.u}\n${x.d||x.c||''}`).join('\n---\n');$('res').innerHTML=r.map((x,i)=>`<div class=msg><b>${i+1}. ${x.t}</b><br><span class=small>${x.d||''}</span><br><a href="${x.u}" target="_blank">${x.u||''}</a><br><button onclick="mods.unshift({t:${JSON.stringify(x.t)},u:${JSON.stringify(x.u)},c:${JSON.stringify((x.c||x.d||'').slice(0,15000))}});save();renderMods()">Добавить как мод</button></div>`).join('')}$('search').onclick=()=>doSearch($('s').value.trim()).catch(e=>alert(e.message));</script></html>
