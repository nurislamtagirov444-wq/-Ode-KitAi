services:
  ollama:
    image: ollama/ollama:latest
    container_name: ode-kitai-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    container_name: ode-kitai-open-webui
    restart: unless-stopped
    depends_on:
      - ollama
    ports:
      - "3000:8080"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
    volumes:
      - open-webui-data:/app/backend/data

  ai-site:
    image: python:3.12-slim
    container_name: ode-kitai-ai-site
    restart: unless-stopped
    depends_on:
      - ollama
    working_dir: /app
    command: python server.py --host 0.0.0.0 --port 7860
    ports:
      - "7860:7860"
    environment:
      OLLAMA_URL: http://ollama:11434
    volumes:
      - ./web:/app:ro

volumes:
  ollama-data:
  open-webui-data:
