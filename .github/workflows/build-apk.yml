name: Build Test APK

on:
  push:
    branches: ["**"]
    paths:
      - "test-apk/**"
      - ".github/workflows/build-apk.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build APK
        working-directory: test-apk
        run: gradle assembleDebug --no-daemon

      - name: Rename APK
        run: cp test-apk/app/build/outputs/apk/debug/app-debug.apk test-app.apk

      - name: Publish to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view apk-test >/dev/null 2>&1 || \
            gh release create apk-test --title "Test APK" --notes "Пустое тестовое приложение (APK)" --target "${GITHUB_SHA}"
          gh release upload apk-test test-app.apk --clobber

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: test-app-apk
          path: test-app.apk
